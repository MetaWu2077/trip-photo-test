name: 编译APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - run: flutter pub get
      
      - name: 编译APK（注入腾讯云密钥）
        env:
          ORG_GRADLE_PROJECT_ciDebugSigning: "true"
        run: |
          flutter build apk --release \
            --dart-define=COS_APP_ID=${{ secrets.COS_APP_ID }} \
            --dart-define=COS_SECRET_ID=${{ secrets.COS_SECRET_ID }} \
            --dart-define=COS_SECRET_KEY=${{ secrets.COS_SECRET_KEY }} \
            --dart-define=COS_REGION=${{ secrets.COS_REGION }} \
            --dart-define=COS_BUCKET=${{ secrets.COS_BUCKET }} \
            --dart-define=COS_DOMAIN=${{ secrets.COS_DOMAIN }}
      
      - uses: actions/upload-artifact@v4
        with:
          name: trip-photo-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
